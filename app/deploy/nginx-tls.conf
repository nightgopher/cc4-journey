server {
    listen 443 ssl http2;
    server_name 150.5.143.32;
    ssl_certificate /etc/letsencrypt/live/cc4-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cc4-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CC4TLS:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/snippets/cc4.conf;
    location = / { return 302 /cc4/$is_args$args; }
    location / { return 404; }
}
