location = /cc4 { return 301 /cc4/; }

location ^~ /.well-known/acme-challenge/ {
    root /var/lib/cc4-acme;
    default_type text/plain;
    try_files $uri =404;
}

location = /mcp {
    if ($scheme = http) { return 308 https://150.5.143.32$request_uri; }
    proxy_pass http://127.0.0.1:3101/mcp;
    include /etc/nginx/snippets/cc4-mcp-proxy.conf;
}

location = /cc4/mcp {
    if ($scheme = http) { return 308 https://150.5.143.32$request_uri; }
    proxy_pass http://127.0.0.1:3101/mcp;
    include /etc/nginx/snippets/cc4-mcp-proxy.conf;
}

location ^~ /cc4/api/ {
    proxy_pass http://127.0.0.1:3101/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 16m;
    add_header Cache-Control "no-store" always;
}

location = /cc4/health {
    proxy_pass http://127.0.0.1:3101/health;
    add_header Cache-Control "no-store" always;
}

location = /cc4/version.json {
    alias /opt/cc4/current/web/version.json;
    add_header Cache-Control "no-store" always;
}

location ^~ /cc4/assets/ {
    alias /opt/cc4/current/web/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /cc4/samples/invoice-demo.png {
    alias /opt/cc4/current/web/samples/invoice-demo.png;
    add_header Cache-Control "no-store" always;
}

location = /cc4/samples/invoice-demo.pdf {
    alias /opt/cc4/current/web/samples/invoice-demo.pdf;
    add_header Cache-Control "no-store" always;
}

location = /cc4/index.html {
    alias /opt/cc4/current/web/index.html;
    add_header Cache-Control "no-store" always;
}

location /cc4/ {
    rewrite ^ /cc4/index.html last;
}
