name: Deploy upstream lead simulator

on:
  push:
    branches: [main]
    paths:
      - 'services/lead-source-mock/**'
      - '.github/workflows/deploy-lead-source-mock.yml'
  pull_request:
    paths:
      - 'services/lead-source-mock/**'
      - '.github/workflows/deploy-lead-source-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cc4-lead-source-mock-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_HOST: 101.47.77.214
  PUBLIC_BASE_URL: http://101.47.77.214/cc4-upstream

jobs:
  test-build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/lead-source-mock
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lead-source-mock/go.mod
          cache: false
      - name: Test independent service
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          bash -n deploy/bootstrap.sh deploy/deploy.sh
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build Linux release
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p release
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_SHA" -o release/lead-source-mock ./cmd/server
          cd release
          sha256sum lead-source-mock > SHA256SUMS
          tar --format=ustar -czf bundle.tar.gz lead-source-mock SHA256SUMS
      - name: Deploy using dedicated restricted SSH key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.CC4_MOCK_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.CC4_MOCK_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 \
            -o UserKnownHostsFile="$key_dir/known_hosts" -i "$key_dir/id_ed25519" \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA" < release/bundle.tar.gz
      - name: Verify public API and pagination
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MOCK_USERNAME: ${{ secrets.CC4_MOCK_USERNAME }}
          MOCK_PASSWORD: ${{ secrets.CC4_MOCK_PASSWORD }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,urllib.parse,urllib.request
          base=os.environ['PUBLIC_BASE_URL']
          def get(path,token=None):
              request=urllib.request.Request(base+path,headers={'Authorization':token} if token else {})
              with urllib.request.urlopen(request,timeout=20) as response:return json.load(response)
          health=get('/health')
          assert health['status']=='ok' and health['mock'] is True and health['revision']==os.environ['GITHUB_SHA'],health
          payload=json.dumps({'username':os.environ['MOCK_USERNAME'],'password':os.environ['MOCK_PASSWORD']}).encode()
          request=urllib.request.Request(base+'/token',data=payload,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=10) as response:token=json.load(response)['data']['token']
          day=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).date().isoformat()
          params={'startTime':day,'endTime':day,'pageSize':'100','scenario':'normal'}
          first=get('/task/cdr/all2?'+urllib.parse.urlencode(dict(params,page=1)),token)
          second=get('/task/cdr/all2?'+urllib.parse.urlencode(dict(params,page=2)),token)
          assert first['mock'] is True and first['data']['totalCount']==120
          assert len(first['data']['data'])==100 and len(second['data']['data'])==20
          rows=first['data']['data']+second['data']['data']
          assert len({row['id'] for row in rows})==120
          assert all(row['realPhone'].startswith('000') for row in rows)
          assert sum(row['grade'].startswith('AF3') for row in rows)==30
          print('Public API verified: current revision, login, 2 pages, 120 synthetic calls, 30 eligible leads.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('Deployed revision `'+health['revision']+'`.\n\n[Health]('+base+'/health) · [OpenAPI]('+base+'/openapi.json)\n\n120 synthetic calls / day; 30 AF3 leads; all phones are non-dialable 000 placeholders.\n')
          PY
