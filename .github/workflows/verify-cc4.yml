name: Student acceptance

on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'services/lead-source-mock/**', '.github/workflows/verify-cc4.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out submitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Run student acceptance in a disposable database
        run: python3 app/verification/verify.py --output "$RUNNER_TEMP/cc4-verification"
      - name: Attach evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc4-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/cc4-verification/
          retention-days: 14
          if-no-files-found: error
