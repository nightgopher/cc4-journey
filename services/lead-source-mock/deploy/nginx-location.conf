# Included inside the existing HTTP default server. Existing locations stay intact.
location = /cc4-upstream {
    return 308 /cc4-upstream/;
}
location ^~ /cc4-upstream/ {
    proxy_pass http://127.0.0.1:18081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    client_max_body_size 8k;
    # The legacy /token endpoint puts credentials in query parameters.
    access_log off;
}
location ^~ /cc4-upstream-deploy/ {
    proxy_pass http://127.0.0.1:18082/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 450s;
    client_max_body_size 32m;
    client_body_timeout 45s;
    access_log off;
}
